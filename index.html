<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Laser Project</title>
    <style>
        select {padding: 4px; border: 2px solid s#0f0101; border-radius: 10px;}


    </style>
</head>
<body>
    <h1>Laser Simulator</h1>
    <div class="box" display: flex>
        <input id="heightslider" type="range" min="100" max="600"><br>
        <input id="radiusslider" type="range" min="20" max="200">
        <select id="selectmat">
            <option value="1">Reflective</option>
            <option value="2">Refractive</option>
            <option value="3">Opaque</option>
        </select>
    </div>

    <input id="ceiling" type="checkbox">
    <br>
    <canvas id="mainCanvas" width="1000" height="700"></canvas>
    <script>
        var objects = [[]]
        const canvas = document.getElementById("mainCanvas");
        const ctxmain = canvas.getContext('2d');
        canvas.style.backgroundColor = "030710"

        const elements = document.querySelectorAll('input');
        elements.forEach((element)=>{
        element.addEventListener('input', function(event) {
           update()
        });
     
        });
        const heightslider = document.getElementById("heightslider");
        const radiusslider = document.getElementById("radiusslider");
        const ceiling = document.getElementById("ceiling");
        const selectmat = document.getElementById("selectmat");

        update()

        function update(){
            objects = [
                [500,350,radiusslider.value,0]
            ]
            ctxmain.fillStyle = "#030710" 
            ctxmain.fillRect(0, 0, canvas.width, canvas.height);
            ctxmain.strokeStyle = "#000000"
            renderobjects()
            simulate()
            ctxmain.strokeStyle = "#050A70"
            ctxmain.lineWidth = 6;
            ctxmain.strokeRect(0, 0, 1000, 700);
            ctxmain.lineWidth = 1;
        }

        function renderobjects(){
            const objectrender = canvas.getContext("2d");
            objectrender.beginPath()
            objects.forEach(element => {
              objectrender.arc(element[0],element[1],element[2],0,Math.PI*2)  
            });
            objectrender.fillStyle = "#141440"
            objectrender.strokeStyle = "#F0F0FF"
            objectrender.lineWidth = 2
            objectrender.fill()
            objectrender.stroke()
            //Draw all objects
        }

        function simulate(){

            var x = 0
            var y = Number(heightslider.value)
            var angle = 0
            //Initialise starting configuration

            let material = 0
            let speed = 1
            const beam = canvas.getContext("2d");
            beam.beginPath();
            beam.moveTo(x, y);
            let d = 0

            for (let i = 0; i < 5000; i++) {
                let oldx = x
                let oldy = y
                x+=speed*Math.cos(angle) 
                y+=speed*Math.sin(angle)
                objects.forEach(element => {
                    if(Math.hypot(element[0] - x, element[1] - y)<element[2] && material == 0){
                        let colangle = Math.atan2(y-element[1],x-element[0])+Math.PI
                        if(colangle>Math.PI){
                            colangle=colangle-2*Math.PI
                        }
                        if(colangle<-Math.PI){
                            colangle=colangle+2*Math.PI
                        }
                        if(selectmat.value ==1){
                            angle = 2*colangle-angle+Math.PI
                        } else if(selectmat.value ==2){angle = colangle+Math.asin((Math.sin(angle-colangle))/1.3);}
                        material = 1
                        beam.lineTo(x,y)
                        console.log(Math.hypot(element[0] - x, element[1] - y))

                    }}); 
                if((y<0 || y>700)&&ceiling.checked){
                    angle*=-1
                    beam.lineTo(x,y)  

                }
                
            }
            beam.lineTo(x,y)  
            beam.strokeStyle = "#FFBBBB"
            beam.lineWidth = 6
            beam.stroke()
            beam.strokeStyle = "#FF0000"
            beam.lineWidth = 2
            beam.stroke()
        }


    </script>
    <h1>Physics of Light Rays</h1>
    

    <br><br><br><br><br>
    Quiz:<br>
    <div id="quiztext"></div>
    <select id="selectquiz"></select><br><br>
    <button id="button345" type="submit" name="button345" value="enter"/>Submit Answer</button>

    <button id="button" type="submit" name="button" value="enter"/>New Question</button>

    <div id="wasyouranswercorrectyesornoactuallyitwasnt"></div>

    <br><br><br>

    <script>
        var numberq = 0
        const dropdownquiz = document.getElementById("selectquiz");
        const textquiz = document.getElementById('quiztext');
        const answerbox = document.getElementById('wasyouranswercorrectyesornoactuallyitwasnt');
        var questions = [
            ["Which of these objects is most likely to be reflective?", ["Tomato","Mirror","Rock","Textbook"],1],
            ["Which of these objects is most likely to refract light?", ["Drinking Glass","Metal Spoon","Rock"],0],
            ["What term is used to describe when light waves bend while traveling through an object?", ["Revision","Reflection","Refraction","Renovation"],2],
            ["What term is used to describe when light waves bounce off of an object?", ["Revision","Reflection","Refraction","Renovation"],1],
            ["Which of these objects is not primarily reflective nor refractive?", ["Glass Window","Bathroom Mirror","Wool Hat","Water"],2],
            ["Fill in the blank : Light bounces off of ________ materials", ["reflective","opaque"],2]
        ];


        askquestion(numberq)
        document.getElementById('button345').onclick = function() {
            if(dropdownquiz.value == questions[numberq][2]){
                answerbox.textContent = "Correct!"
            } else {
                answerbox.textContent = "Incorrect, the correct answer was "+(questions[numberq][1][questions[numberq][2]]).toString()+"."
            }


        };
        document.getElementById('button').onclick = function() {
            numberq = (numberq+1)%(questions.length)
            askquestion(numberq)
            answerbox.textContent = ""             
        };

        function askquestion(i) {
            dropdownquiz.options.length = 0;
            textquiz.textContent = questions[i][0]
            for (var j = 0; j < questions[i][1].length; j++) {
                var option = document.createElement("option");
                option.text = questions[i][1][j];
                option.value = j;
                dropdownquiz.add(option);
            }
        }




    </script>

</body>
</html>
