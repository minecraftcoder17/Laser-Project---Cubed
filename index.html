<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Laser Project</title>
</head>
<body>
    <h1>Laser Simulator</h1>
    <canvas id="mainCanvas" width="1000" height="700">

    </canvas>
    <script>
        const canvas = document.getElementById("mainCanvas");
        simulate()
        
        function simulate(){
            var x = 0
            var y = 350
            var angle = 0
            //Initialise starting configuration

            let material = 0
            let speed = 1
            const beam = canvas.getContext("2d");
            beam.beginPath();
            beam.moveTo(x, y);

            for (let i = 0; i < 500; i++) {
                x+=speed*Math.cos(angle) 
                y+=speed*Math.sin(angle) 
                beam.lineTo(x,y)  
            }
            beam.stroke()
        }



    </script>
</body>
</html>
